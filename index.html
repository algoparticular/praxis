<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <!-- Opened from the Home Screen the page goes under the clock and the battery (Sid's world shows its sky there; the
         rest of the app paints that strip navy, .status-strip in App.vue). iOS reads this when the icon is added. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta property="og:title" content="Algo Particular">
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Guía tu intuición consultando al Oráculo de las Partículas. Toma tu carta y deja que el corazón vibre con el mensaje.">
    <meta property="og:image" content="https://algoparticular.com/Oracle_2.jpg">
    <meta property="og:url" content="https://algoparticular.com">
    <meta property="og:site_name" content="Algo Particular">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@algoparticular">
    <meta name="twitter:image:alt" content="Welcome particles!">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- The icon iOS puts on the Home Screen (it does not read the manifest's): 180 px, opaque, from icon-512.png -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">


    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Algo Particular</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

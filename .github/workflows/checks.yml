# What a pull request has to pass before it is merged. The same steps run on a computer with `npm run check`.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The same Node as Netlify (netlify.toml)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Cards (data, pictures, share pages)
        run: npm run check:cards

      - name: Size budgets
        run: npm run check:budget

      - name: Browser
        # Only the headless shell, which is what the smoke test drives: half the download
        run: npx playwright install --with-deps --only-shell chromium

      - name: Smoke test (every page and card, in a real browser)
        timeout-minutes: 8
        run: npm run check:smoke
